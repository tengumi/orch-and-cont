name: lab2-taskflow

x-taskflow: &taskflow
  image: itmo-taskflow:lab2
  pull_policy: build
  build:
    context: ..
    dockerfile: lab2/Dockerfile
  env_file: .env
  networks: [taskflow]

services:
  db:
    image: postgres:16-alpine
    container_name: lab2-taskflow-db
    env_file: .env
    networks: [taskflow]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    <<: *taskflow
    container_name: lab2-taskflow-migrate
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *taskflow
    container_name: lab2-taskflow-api
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/openapi.json', timeout=2).close()"]
      interval: 2s
      timeout: 3s
      retries: 15

  nginx:
    image: nginxinc/nginx-unprivileged:1.30-alpine3.24
    container_name: lab2-taskflow-nginx
    depends_on:
      api:
        condition: service_healthy
        restart: true
    networks: [taskflow]
    ports:
      - "127.0.0.1:18082:8080"
    configs:
      - source: nginx-config
        target: /etc/nginx/conf.d/default.conf
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/openapi.json"]
      interval: 2s
      timeout: 3s
      retries: 15

configs:
  nginx-config:
    file: ./nginx.conf

networks:
  taskflow:

volumes:
  postgres-data:
